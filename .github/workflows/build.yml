name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build Windows exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name CueRunner --icon assets/icon.ico
          --paths src run_cuerunner.py
      - uses: actions/upload-artifact@v4
        with:
          name: CueRunner-windows
          path: dist/CueRunner.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build macOS app
        run: >
          pyinstaller --noconfirm --windowed --name CueRunner --icon assets/icon.icns
          --paths src run_cuerunner.py
      - name: Package .dmg
        run: |
          hdiutil create -volname CueRunner -srcfolder dist/CueRunner.app \
            -ov -format UDZO dist/CueRunner.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: CueRunner-macos
          path: dist/CueRunner.dmg

  release:
    # Runs on a version tag, or on a push to main when the version in version.py has no release yet.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.*)\"', open('src/cuerunner/version.py').read()).group(1))")
            TAG="v${VERSION}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          path: downloads
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            downloads/CueRunner-windows/CueRunner.exe
            downloads/CueRunner-macos/CueRunner.dmg
