name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build Windows exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name CueRunner
          --paths src run_cuerunner.py
      - uses: actions/upload-artifact@v4
        with:
          name: CueRunner-windows
          path: dist/CueRunner.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build macOS app
        run: >
          pyinstaller --noconfirm --windowed --name CueRunner
          --paths src run_cuerunner.py
      - name: Package .dmg
        run: |
          hdiutil create -volname CueRunner -srcfolder dist/CueRunner.app \
            -ov -format UDZO dist/CueRunner.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: CueRunner-macos
          path: dist/CueRunner.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            downloads/CueRunner-windows/CueRunner.exe
            downloads/CueRunner-macos/CueRunner.dmg
